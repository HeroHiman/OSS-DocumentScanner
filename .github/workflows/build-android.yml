name: 'build-android'

on:
  push:
    branches:
      - main
      - feat/*
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository & submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.9.4 --activate

      - name: Install NativeScript CLI
        run: |
          python3 -m pip install --upgrade pip six
          npm i -g @akylas/nativescript-cli --ignore-scripts --legacy-peer-deps
          ns package-manager set yarn2
          ns usage-reporting disable
          ns error-reporting disable

      - name: Download Native Libraries (OpenCV & Tesseract)
        run: |
          mkdir -p /tmp/dev_resources
          curl -fL -o /tmp/dev_resources/android.zip https://github.com/ossappscollective/OSS-DocumentScanner/releases/download/dev_resources/android.zip
          unzip -o -q /tmp/dev_resources/android.zip -d .
          rm -rf /tmp/dev_resources

      - name: Install dependencies
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      - name: Run Tests
        run: yarn test

      - name: Build Android App (Debug)
        run: |
          ns build android --env.devlog --env.production=0
        env:
          APP_ID: com.akylas.documentscanner
          APP_BUILD_PATH: build/documentscanner
          APP_RESOURCES: App_Resources/documentscanner

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: document-scanner-debug-apk
          path: |
            build/**/outputs/apk/**/*.apk
            build/**/*.apk
            platforms/**/outputs/apk/**/*.apk
            dist/*.apk
          retention-days: 7
          if-no-files-found: error
